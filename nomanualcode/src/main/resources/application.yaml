spring:
  application:
    name: nomanualcode
  datasource:
    url: jdbc:h2:mem:nomanualcode
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:insert.sql
  h2:
    console:
      enabled: true
      path: /h2-console
